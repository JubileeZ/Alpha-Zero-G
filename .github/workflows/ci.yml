name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  aggregate:
    name: run-all (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Force LF checkouts and Git identity
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install deps (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: |
          command -v jq >/dev/null || brew install jq
          command -v shellcheck >/dev/null || brew install shellcheck
          # Do NOT brew-install bash for CI: GHA macos-latest PATH bash is 3.2.
          # lib/ must stay free of Bash 4-only builtins (mapfile, declare -A, ${var,,})
          # so aggregate gate matches real macOS /bin/bash users.

      - name: Install deps (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Chocolatey CDN 503s have red-gated Windows Sanity (shellcheck). Keep jq on
          # choco with retries; install shellcheck from GitHub releases instead.
          $chocoBin = 'C:\ProgramData\chocolatey\bin'
          $toolsBin = Join-Path $env:RUNNER_TEMP 'azg-tools'
          New-Item -ItemType Directory -Force -Path $toolsBin | Out-Null
          $chocoBin, $toolsBin | ForEach-Object {
            $_ | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          $env:Path = "$toolsBin;$chocoBin;$env:Path"

          if (-not (Get-Command jq -ErrorAction SilentlyContinue)) {
            $jqOk = $false
            for ($i = 1; $i -le 3; $i++) {
              choco install jq -y --no-progress --skip-already-installed
              if (Get-Command jq -ErrorAction SilentlyContinue) { $jqOk = $true; break }
              Start-Sleep -Seconds (5 * $i)
            }
            if (-not $jqOk) { throw 'jq install failed after choco retries' }
          }

          if (-not (Get-Command shellcheck -ErrorAction SilentlyContinue)) {
            $ver = 'v0.11.0'
            $zip = Join-Path $env:RUNNER_TEMP 'shellcheck.zip'
            $url = "https://github.com/koalaman/shellcheck/releases/download/$ver/shellcheck-$ver.zip"
            Invoke-WebRequest -Uri $url -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $toolsBin -Force
            if (-not (Test-Path (Join-Path $toolsBin 'shellcheck.exe'))) {
              throw 'shellcheck.exe missing from GitHub release zip'
            }
          }

          Get-Command jq, shellcheck | Format-Table Name, Source

      - name: Sanity (jq / shellcheck / python)
        run: |
          command -v bash
          bash --version | head -1
          command -v jq
          command -v shellcheck
          command -v python3
          jq --version
          shellcheck --version | head -2
          python3 --version
          # Guard: working tree must be LF for shell scripts (Windows autocrlf regressions)
          if tr -cd '\r' < azg | grep -q .; then
            echo "::error::azg has CR — .gitattributes / autocrlf misconfigured"
            exit 1
          fi
          # Guard: no Bash 4-only builtins in lib/ (GHA macos-latest = bash 3.2; ignore comments)
          if grep -nE '(^|[[:space:]])(mapfile|readarray)([[:space:]]|$)|declare[[:space:]]+-A' lib/*.sh \
            | grep -vE '^[^:]+:[[:digit:]]+:[[:space:]]*#'; then
            echo "::error::Bash 4-only builtin in lib/ — breaks macos-latest CI (bash 3.2)"
            exit 1
          fi

      - name: Aggregate gate
        env:
          AZG_STRICT: "1"
        run: bash tests/run-all.sh
